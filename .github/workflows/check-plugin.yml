name: Validar plugin Nicky

on:
  push:
    branches: [main]
    paths:
      - 'plugins/nicky/**'
      - '.github/workflows/check-plugin.yml'
      - '.github/workflows/publish-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins/nicky
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Instalar dependências com versões travadas
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Testar
        run: pnpm test
      - name: Compilar
        run: pnpm run build
